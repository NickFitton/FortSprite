name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortsprite-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify GitHub production secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            CONVEX_DEPLOY_KEY
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing production secret::$name is required"
              exit 1
            fi
          done

          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error title=Invalid DATABASE_URL::DATABASE_URL must be a PostgreSQL connection string"
              exit 1
              ;;
          esac

      - name: Verify Prisma database access
        run: printf 'SELECT 1;' | pnpm exec prisma db execute --stdin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify Convex deployment access
        run: pnpm exec convex deploy --dry-run --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Pull Vercel production configuration
        run: pnpm dlx vercel@latest pull --yes --environment=production --debug --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify Vercel production variables
        run: |
          set -euo pipefail
          required=(
            DATABASE_URL
            VITE_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            VITE_CONVEX_URL
          )

          for name in "${required[@]}"; do
            if ! grep -q "^${name}=" .vercel/.env.production.local; then
              echo "::error title=Missing Vercel production variable::$name is required"
              exit 1
            fi
          done

      - name: Build Vercel production output
        run: pnpm dlx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Apply Prisma migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy Convex functions
        run: pnpm exec convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy prebuilt output to Vercel
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
