services:
  postgres:
    image: postgres:16-alpine
    container_name: fort-sprite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fort_sprite
      POSTGRES_USER: fort_sprite
      POSTGRES_PASSWORD: fort_sprite
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fort_sprite -d fort_sprite']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
